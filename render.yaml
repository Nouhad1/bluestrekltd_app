services:
  - type: web
    name: bluestrekltd_app
    env: docker
    branch: main
    plan: free
    region: oregon
    # Le Dockerfile à la racine sera utilisé automatiquement
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: bluestrekltd_db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bluestrekltd_db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: bluestrekltd_db
          property: name
      - key: DB_USERNAME
        fromDatabase:
          name: bluestrekltd_db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bluestrekltd_db
          property: password

databases:
  - name: bluestrekltd_db
    databaseName: db_bluestrekltd
    user: root
    generatePassword: true  
    engine: mysql
    version: 8
    plan: free
    region: oregon

